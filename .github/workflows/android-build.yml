name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout my app
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Build Termux from source
      run: |
        cd $GITHUB_WORKSPACE/..
        git clone --depth 1 --branch v0.118.0 https://github.com/termux/termux-app.git
        cd termux-app
        ./gradlew :terminal-emulator:assembleRelease \
                  :terminal-view:assembleRelease \
                  :termux-shared:assembleRelease
        mkdir -p $GITHUB_WORKSPACE/app/libs
        find . -name "*.aar" -exec cp {} $GITHUB_WORKSPACE/app/libs/ \;
        ls -la $GITHUB_WORKSPACE/app/libs/
    
    - name: Build CodeMaster AI
      run: |
        cd $GITHUB_WORKSPACE
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CodeMaster-AI-Debug
        path: app/build/outputs/apk/debug/*.apk
