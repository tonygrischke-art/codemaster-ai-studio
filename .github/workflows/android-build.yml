name: Build APK with Termux

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout my app
      uses: actions/checkout@v3
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Clone and build Termux
      run: |
        cd ..
        git clone --depth 1 --branch v0.118.0 https://github.com/termux/termux-app.git
        cd termux-app
        
        ./gradlew :terminal-emulator:assembleRelease
        ./gradlew :terminal-view:assembleRelease
        ./gradlew :termux-shared:assembleRelease
        
        mkdir -p $GITHUB_WORKSPACE/app/libs
        find . -name "terminal-emulator-release.aar" -exec cp {} $GITHUB_WORKSPACE/app/libs/ \;
        find . -name "terminal-view-release.aar" -exec cp {} $GITHUB_WORKSPACE/app/libs/ \;
        find . -name "termux-shared-release.aar" -exec cp {} $GITHUB_WORKSPACE/app/libs/ \;
        
        ls -la $GITHUB_WORKSPACE/app/libs/
    
    - name: Build my app
      run: |
        cd $GITHUB_WORKSPACE
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: CodeMaster-AI-Debug
        path: app/build/outputs/apk/debug/*.apk
